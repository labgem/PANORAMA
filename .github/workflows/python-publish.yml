# Publish PANORAMA to PyPI
#
# - On a GitHub release: automatically publish to PyPI
# - Manually: optionally publish to TestPyPI and/or PyPI

name: Publish Python Package

on:
  release:
    types: [released]

  workflow_dispatch:
    inputs:
      publish_test:
        description: "Publish to TestPyPI"
        required: true
        type: boolean
        default: false
      publish_to_pypi:
        description: "Publish to PyPI"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish-test:
    runs-on: ubuntu-latest
    needs: release-build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test == true

    permissions:
      id-token: write

    environment:
      name: testpypi
      url: https://test.pypi.org/project/panorama-sys/
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build

    if: >-
      (github.event_name == 'release' && github.event.action == 'released') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true)

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/panorama-sys/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

